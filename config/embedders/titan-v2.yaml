###############################################################################
# Bedrock Titan Embed Text v2 config
# -----------------------------------------------------------------------------
# Cheapest in-region multilingual embedding model. See ADR-0003.
###############################################################################

provider: bedrock
model_id: amazon.titan-embed-text-v2:0
dimensions: 1024
normalize: true
batch_size: 25
max_retries: 3
timeout_seconds: 30
region: ap-south-1
