###############################################################################
# DataCurator - CI workflow
# -----------------------------------------------------------------------------
# Runs on every push and PR:
# - Python lint (ruff), format check, type check (mypy)
# - Python tests (pytest, coverage)
# - OPA policy tests
# - Markdown lint
# - YAML lint
# - Secret scan (gitleaks)
# - Terraform fmt + validate + tflint + tfsec
###############################################################################

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.9.5"
  OPA_VERSION: "0.66.0"

jobs:
  python:
    name: Python (lint, type-check, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy type check
        run: mypy src

      - name: Pytest
        run: pytest tests/unit -v --tb=short

      - name: Bandit security scan
        run: bandit -r src -ll

  opa:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o /tmp/opa https://openpolicyagent.org/downloads/v${{ env.OPA_VERSION }}/opa_linux_amd64_static
          chmod +x /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa

      - name: Run OPA tests
        run: opa test policies/ -v

  terraform:
    name: Terraform (fmt, validate, lint, sec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -recursive -check -diff

      - name: Terraform validate (dev)
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --recursive --minimum-failure-severity=warning
        working-directory: infra/terraform

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform
          soft_fail: false

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !node_modules/**

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks *binary* rather than gitleaks-action@v2.
      #
      # The action refuses to run for organization-owned repositories without
      # a paid licence key ("[org] is an organization. License key is
      # required."), so this job could never pass here. The binary is the
      # same scanner under Apache-2.0 with no such gate.
      - name: Scan for secrets
        run: |
          VERSION=8.21.2
          curl -sSL -o gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner

  summary:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [python, opa, terraform, markdown, secrets]
    if: success()
    steps:
      - run: echo "All CI checks passed ✅"
