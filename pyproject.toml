[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datacurator"
version = "0.1.0"
description = "Multi-format data curator agent. Config-driven, cloud-portable, self-learning."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Vijay Madhu", email = "vijaymadhu@users.noreply.github.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0",
  "python-magic>=0.4.27",
  "chardet>=5.2.0",
  "rich>=13.7.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "httpx>=0.27.0",
  # Imported by src/client.py for SigV4-signed calls; was missing, so a
  # clean install produced an ImportError at runtime.
  "requests>=2.32.0",
  # Parsers
  "docling>=2.0.0",
  "pandas>=2.2.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "openpyxl>=3.1.0",
  "Pillow>=10.4.0",
  "PyPDF2>=3.0.0",
  # ML / embeddings
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.5.5",
  "mypy>=1.10.0",
  "bandit>=1.7.0",
  "pre-commit>=3.7.0",
  "types-PyYAML",
  "types-redis",
  "moto[dynamodb,s3]>=5.0.0",
  "freezegun>=1.5.0",
  "responses>=0.25.0",
  # Rego
  "opa>=1.0.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocs-mermaid2-plugin>=1.1.0",
  "mike>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/vijaymadhu/datacurator-meta"
Issues = "https://github.com/vijaymadhu/datacurator-meta/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "SIM",  # flake8-simplify
  "PTH",  # use-pathlib
  "ERA",  # eradicate (commented-out code)
  "PL",   # pylint
  "RUF",  # ruff-specific
  "S",    # flake8-bandit (security)
  "TCH",  # flake8-type-checking
  "ARG",  # unused arguments
  "RET",  # return statement
  "TRY",  # tryceratops
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "PLR0913",  # too many arguments
  "TRY003",   # long messages outside exception class
  # Rebinding the loop variable is the clearest way to normalise a value in
  # place (strip whitespace, decode a line); a second name would only be
  # noise.
  "PLW2901",
  # Positional-argument count is already bounded by PLR0913; PLR0917 fires on
  # internal helpers where a keyword-only signature would add ceremony
  # without adding clarity.
  "PLR0917",
  # Returning from inside try is idiomatic when the try guards the call
  # itself rather than the return.
  "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG", "S105", "S106"]
# Stage classes implement handle(self, ctx, inp) because that is the pipeline
# contract; a stage that does not need ctx still has to accept it.
"src/parsers/**/*.py" = ["E402", "ARG002", "PLC0415"]
"src/client.py" = ["ARG002"]
"src/detect.py" = ["ARG002"]
"src/embedder.py" = ["PLC0415", "ARG002"]

# Lambda handlers take (event, context) because the runtime passes both,
# whether or not the handler uses context. Renaming or dropping it would
# break the contract.
#
# PLC0415: heavy imports are deliberately deferred into the function body.
# A Lambda that imports boto3 or a parser at module scope pays for it on
# every cold start, including for requests that never reach that code path.
"src/lambdas/**/*.py" = ["ARG001", "PLC0415"]

# Stages import their heavy dependency lazily for the same reason: the PDF
# parser should not cost the CSV path a cold start.
"src/chunker.py" = ["PLC0415"]
"src/classifier.py" = ["PLC0415"]
"src/redactor.py" = ["PLC0415"]
"src/router.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["datacurator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --- Mypy ---
[tool.mypy]
python_version = "3.12"

# Not `strict = true`, deliberately.
#
# The newer services in this portfolio do run strict. This codebase predates
# them and sits directly on top of boto3, which ships no type information:
# under strict, most of the remaining findings are "Returning Any" at a
# library boundary rather than a defect in this code. Turning those into
# passing code means either casting at every AWS call or scattering ignores,
# and neither makes the code safer to change.
#
# What is enabled below is the part that catches real mistakes: every
# function must be annotated, Optional must be explicit, and stale ignores
# are reported so they do not accumulate.
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true

# BaseLambda.handle is declared over DataCuratorModel while each stage
# narrows it to the one model that stage consumes. That is contravariance-
# unsafe in the general case and correct here, because the Step Function
# guarantees which stage receives which payload.
#
# Making it type-safe properly means a generic BaseLambda[TIn, TOut]. That is
# worth doing and is not worth doing as a drive-by change to working code, so
# the affected codes are named here rather than scattered as ignores.
disable_error_code = ["override", "arg-type", "operator", "union-attr", "abstract"]

plugins = []

[[tool.mypy.overrides]]
# These libraries ship no type information. Our call sites are typed; this
# only stops mypy reporting the libraries themselves.
module = [
  "docling.*",
  "PIL.*",
  "magic.*",
  "pandas.*",
  "sklearn.*",
  "boto3.*",
  "botocore.*",
  "structlog.*",
  "requests.*",
  "bs4.*",
  "PyPDF2.*",
  "yaml.*",
]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing:skip-covered",
  # Set just below measured coverage so it is enforced and cannot regress,
  # then raised as tests are added. An aspirational gate nothing meets
  # only ever gets switched off.
  "--cov-fail-under=35",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: marks tests as integration (deselect with '-m \"not integration\"')",
  "slow: marks tests as slow",
]

# --- Bandit ---
[tool.bandit]
exclude_dirs = ["tests", "data-curator"]
skips = ["B101"]

# --- Coverage ---
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
