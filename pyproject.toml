[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datacurator"
version = "0.1.0"
description = "Multi-format data curator agent. Config-driven, cloud-portable, self-learning."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Vijay Madhu", email = "vijaymadhu@users.noreply.github.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "boto3>=1.35.0",
  "botocore>=1.35.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0",
  "python-magic>=0.4.27",
  "chardet>=5.2.0",
  "rich>=13.7.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "httpx>=0.27.0",
  # Parsers
  "docling>=2.0.0",
  "pandas>=2.2.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "openpyxl>=3.1.0",
  "Pillow>=10.4.0",
  "PyPDF2>=3.0.0",
  # ML / embeddings
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.5.5",
  "mypy>=1.10.0",
  "bandit>=1.7.0",
  "pre-commit>=3.7.0",
  "types-PyYAML",
  "types-redis",
  "moto[dynamodb,s3]>=5.0.0",
  "freezegun>=1.5.0",
  "responses>=0.25.0",
  # Rego
  "opa>=1.0.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocs-mermaid2-plugin>=1.1.0",
  "mike>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/vijaymadhu/datacurator-meta"
Issues = "https://github.com/vijaymadhu/datacurator-meta/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "SIM",  # flake8-simplify
  "PTH",  # use-pathlib
  "ERA",  # eradicate (commented-out code)
  "PL",   # pylint
  "RUF",  # ruff-specific
  "S",    # flake8-bandit (security)
  "TCH",  # flake8-type-checking
  "ARG",  # unused arguments
  "RET",  # return statement
  "TRY",  # tryceratops
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "PLR0913",  # too many arguments
  "TRY003",   # long messages outside exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG", "S105", "S106"]
"src/parsers/**/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["datacurator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docling.*", "PIL.*", "magic.*", "pandas.*", "sklearn.*"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=85",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: marks tests as integration (deselect with '-m \"not integration\"')",
  "slow: marks tests as slow",
]

# --- Bandit ---
[tool.bandit]
exclude_dirs = ["tests", "data-curator"]
skips = ["B101"]

# --- Coverage ---
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
